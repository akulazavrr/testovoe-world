<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Мета-теги читают соцсети и поисковики без JavaScript, поэтому эти тексты продублированы здесь, а не в content.js -->
  <title>Мир тестового задания — Катя Колосова для ВкусВилла</title>
  <meta name="description" content="На этой карте спрятано тестовое задание Кати Колосовой на роль креативного продюсера во ВкусВилле. Нажимайте на всё, что шевелится.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Мир тестового задания — Катя Колосова для ВкусВилла">
  <meta property="og:description" content="На этой карте спрятано тестовое задание Кати Колосовой на роль креативного продюсера во ВкусВилле. Нажимайте на всё, что шевелится.">
  <!-- При публикации заменить на полный адрес: https://<логин>.github.io/<репозиторий>/assets/og.png -->
  <meta property="og:image" content="assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#86aee0">

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,700;1,400&family=Unbounded:wght@500;700&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/memes.css">
  <link rel="stylesheet" href="css/house.css">
  <link rel="stylesheet" href="css/iceberg.css">
  <link rel="stylesheet" href="css/kilka.css">

  <script type="module" src="js/main.js"></script>
</head>
<body>

  <!-- ГЛАВНАЯ КАРТА. Тексты подставляет js/main.js из js/content.js -->
  <main class="map" id="map">
    <header class="map__header">
      <h1 class="map__title" data-text="map.title"></h1>
      <p class="map__subtitle" data-text="map.subtitle"></p>
    </header>

    <div class="map__world">
      <!-- Фон: неподвижные слои -->
      <div class="layer layer--mountains" aria-hidden="true"></div>
      <div class="layer layer--land" aria-hidden="true"></div>
      <div class="layer layer--water" aria-hidden="true"></div>

      <!-- Деревья: неподвижное наполнение мира -->
      <div class="decor" aria-hidden="true">
        <!-- От дальних к ближним: ближние перекрывают дальние -->
        <img class="tree tree--h" src="assets/map/tree-2.svg" alt="" width="150" height="260">
        <img class="tree tree--i" src="assets/map/tree-1.svg" alt="" width="200" height="240">
        <img class="tree tree--m" src="assets/map/tree-1.svg" alt="" width="200" height="240">
        <img class="tree tree--d" src="assets/map/tree-3.svg" alt="" width="160" height="150">
        <img class="tree tree--c" src="assets/map/tree-3.svg" alt="" width="160" height="150">
        <img class="tree tree--l" src="assets/map/tree-2.svg" alt="" width="150" height="260">
        <img class="tree tree--g" src="assets/map/tree-3.svg" alt="" width="160" height="150">
        <img class="tree tree--e" src="assets/map/tree-2.svg" alt="" width="150" height="260">
        <img class="tree tree--b" src="assets/map/tree-2.svg" alt="" width="150" height="260">
        <img class="tree tree--j" src="assets/map/tree-3.svg" alt="" width="160" height="150">
        <img class="tree tree--k" src="assets/map/tree-1.svg" alt="" width="200" height="240">
        <img class="tree tree--a" src="assets/map/tree-1.svg" alt="" width="200" height="240">
        <img class="tree tree--f" src="assets/map/tree-1.svg" alt="" width="200" height="240">
      </div>

      <!-- Объекты: кнопки, открывающие разделы -->
      <button class="map-object map-object--memes" type="button" data-section="memes">
        <span class="map-object__art map-object__art--cloud">
          <img src="assets/map/cloud.png" alt="" width="920" height="424">
        </span>
        <span class="map-object__label" data-text="sections.memes.mapLabel"></span>
      </button>

      <button class="map-object map-object--house" type="button" data-section="house">
        <span class="map-object__art map-object__art--house">
          <img src="assets/map/house.svg" alt="" width="170" height="150">
          <img class="house-door" src="assets/map/door.svg" alt="" width="22" height="38">
        </span>
        <span class="map-object__label" data-text="sections.house.mapLabel"></span>
      </button>

      <button class="map-object map-object--iceberg" type="button" data-section="iceberg">
        <span class="map-object__art map-object__art--iceberg">
          <img src="assets/map/iceberg.png" alt="" width="640" height="539">
        </span>
        <span class="map-object__label" data-text="sections.iceberg.mapLabel"></span>
      </button>

      <button class="map-object map-object--kilka" type="button" data-section="kilka">
        <span class="map-object__art map-object__art--kilka">
          <span class="kilka-ripple"></span>
          <span class="kilka-ripple kilka-ripple--out"></span>
          <!-- Килька и томаты выпрыгивают из воды вместе: всё, что ниже линии воды, обрезано -->
          <span class="kilka-jump">
            <img class="kilka-tomato kilka-tomato--1" src="assets/map/tomato.svg" alt="" width="64" height="60">
            <img class="kilka-fish" src="assets/map/fish.svg" alt="" width="120" height="80">
            <img class="kilka-tomato kilka-tomato--2" src="assets/map/tomato.svg" alt="" width="64" height="60">
            <img class="kilka-tomato kilka-tomato--3" src="assets/map/tomato.svg" alt="" width="64" height="60">
          </span>
        </span>
        <span class="map-object__label" data-text="sections.kilka.mapLabel"></span>
      </button>
    </div>
  </main>

  <!-- РАЗДЕЛЫ. Открываются поверх карты, у каждого свой якорь: #memes, #house, #iceberg, #kilka -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" hidden>
    <button class="back-button" type="button" id="back-button">
      <span aria-hidden="true">←</span>
      <span data-text="ui.backToMap"></span>
    </button>

    <section class="section section--memes" data-section-root="memes" hidden></section>
    <section class="section section--house" data-section-root="house" hidden></section>
    <section class="section section--iceberg" data-section-root="iceberg" hidden></section>
    <section class="section section--kilka" data-section-root="kilka" hidden></section>
  </div>

</body>
</html>
