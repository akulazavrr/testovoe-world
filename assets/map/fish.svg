<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Килька в прыжке -->
  <defs>
    <filter id="brush" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
    <clipPath id="body">
      <path d="M24 40 C40 22 82 18 108 38 C84 58 42 58 24 40 Z"/>
    </clipPath>
  </defs>

  <g transform="rotate(-22 60 40)" filter="url(#brush)">
    <!-- Хвост и плавники -->
    <path d="M28 40 L6 25 L12 40 L6 55 Z" fill="#6f8aa6"/>
    <path d="M56 26 L66 16 L74 25 Z" fill="#6f8aa6"/>
    <path d="M60 52 L68 60 L72 51 Z" fill="#8ea4bc"/>
    <!-- Тело: тёмная спинка, серебристые бока, светлое брюшко -->
    <g clip-path="url(#body)">
      <rect x="0" y="0" width="120" height="80" fill="#b9cadb"/>
      <path d="M20 20 C50 22 80 24 112 34 L112 0 L20 0 Z" fill="#6f8aa6"/>
      <path d="M20 46 C50 46 80 46 112 40 L112 80 L20 80 Z" fill="#eef3f8"/>
      <path d="M30 36 C56 32 84 32 104 36" stroke="#dfe8f1" stroke-width="2" fill="none"/>
    </g>
    <path d="M88 26 C96 32 96 44 88 50" stroke="#8ea4bc" stroke-width="2" fill="none"/>
    <circle cx="96" cy="35" r="3.6" fill="#2a2a4a"/>
    <circle cx="97" cy="34" r="1.2" fill="#ffffff"/>
  </g>

</svg>
