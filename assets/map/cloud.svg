<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <!-- «Мемное облако» в технике акварели (референс docs/references/ref-6-watercolor-cloud.jpg).
       Каждая часть облака — набор кругов; фильтр превращает их общий силуэт в акварельное пятно:
       неровный край, тёмная голубая кромка, светлая середина, фактура бумаги. -->
  <defs>
    <filter id="wc" x="-10%" y="-15%" width="120%" height="130%" color-interpolation-filters="sRGB">
      <!-- Неровный край -->
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="warp"/>
      <feDisplacementMap in="SourceAlpha" in2="warp" scale="5" result="shape"/>
      <!-- Голубая заливка всего пятна -->
      <feFlood flood-color="#c4dbf3"/>
      <feComposite in2="shape" operator="in" result="base"/>
      <!-- Светлая середина: сжатый и размытый силуэт -->
      <feMorphology in="shape" operator="erode" radius="11" result="inner"/>
      <feGaussianBlur in="inner" stdDeviation="11" result="innerSoft"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.92"/>
      <feComposite in2="innerSoft" operator="in"/>
      <feComposite in2="shape" operator="in" result="white"/>
      <!-- Тёмная кромка у края, как у высохшей акварели -->
      <feMorphology in="shape" operator="erode" radius="1.5" result="rim"/>
      <feGaussianBlur in="rim" stdDeviation="1" result="rimSoft"/>
      <feComposite in="shape" in2="rimSoft" operator="out" result="edge"/>
      <feFlood flood-color="#76a0d8" flood-opacity="0.85"/>
      <feComposite in2="edge" operator="in" result="edgeColor"/>
      <feMorphology in="shape" operator="erode" radius="5" result="band"/>
      <feGaussianBlur in="band" stdDeviation="4" result="bandSoft"/>
      <feComposite in="shape" in2="bandSoft" operator="out" result="bandEdge"/>
      <feFlood flood-color="#9dbde6" flood-opacity="0.45"/>
      <feComposite in2="bandEdge" operator="in" result="bandColor"/>
      <!-- Фактура бумаги и разводы пигмента -->
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="8" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.6  0 0 0 0 0.85  0 0 0 0.28 -0.08" result="grainTint"/>
      <feComposite in="grainTint" in2="shape" operator="in" result="paper"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="12" result="bloom"/>
      <feColorMatrix in="bloom" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.72  0 0 0 0 0.92  1.1 0 0 0 -0.45" result="bloomTint"/>
      <feComposite in="bloomTint" in2="shape" operator="in" result="blooms"/>
      <feMerge>
        <feMergeNode in="base"/>
        <feMergeNode in="blooms"/>
        <feMergeNode in="white"/>
        <feMergeNode in="bandColor"/>
        <feMergeNode in="edgeColor"/>
        <feMergeNode in="paper"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Дальнее большое облако -->
  <g filter="url(#wc)" fill="#000">
    <circle cx="44" cy="98" r="26"/>
    <circle cx="82" cy="78" r="34"/>
    <circle cx="128" cy="62" r="42"/>
    <circle cx="176" cy="74" r="30"/>
    <rect x="18" y="92" width="190" height="44" rx="22"/>
  </g>

  <!-- Облако справа сверху -->
  <g filter="url(#wc)" fill="#000">
    <circle cx="190" cy="58" r="24"/>
    <circle cx="226" cy="52" r="20"/>
    <circle cx="228" cy="76" r="26"/>
    <circle cx="258" cy="70" r="24"/>
    <circle cx="288" cy="96" r="22"/>
    <rect x="176" y="70" width="128" height="52" rx="24"/>
  </g>

  <!-- Переднее облако в центре -->
  <g filter="url(#wc)" fill="#000">
    <circle cx="132" cy="108" r="26"/>
    <circle cx="170" cy="92" r="32"/>
    <circle cx="210" cy="108" r="26"/>
    <rect x="110" y="106" width="124" height="38" rx="19"/>
  </g>
</svg>
