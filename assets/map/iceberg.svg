<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150">
  <!-- «Айсберг вирусного спеца». Одна цельная фигура; граница воды — одна волнистая линия -->
  <defs>
    <filter id="brush" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="1.2"/></filter>
    <!-- Силуэт айсберга целиком -->
    <clipPath id="ice">
      <path d="M20 60 L48 22 L62 32 L82 6 L108 40 L120 60 L134 96 L114 136 L56 146 L8 104 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#brush)">
    <g clip-path="url(#ice)">
      <!-- Грани, общие для надводной и подводной части -->
      <rect width="140" height="150" fill="#ffffff"/>
      <path d="M82 6 L108 40 L120 60 L134 96 L114 136 L84 96 L78 30 Z" fill="#cfe2f7"/>
      <path d="M48 22 L62 32 L60 96 L40 80 Z" fill="#e8f2fd"/>
      <path d="M8 104 L30 70 L56 146 Z" fill="#dbeafa"/>
      <path d="M84 96 L114 136 L56 146 Z" fill="#b9d4f2"/>
      <!-- Вода поверх подводной части. Её верхний край — та же волна, что у поверхности -->
      <path d="M0 61 Q8 56 16 61 T32 61 T48 61 T64 61 T80 61 T96 61 T112 61 T128 61 T144 61 L144 150 L0 150 Z" fill="#4f8ad6" opacity="0.5"/>
    </g>
  </g>

  <!-- Пена вдоль кромки воды только у самого айсберга -->
  <g clip-path="url(#ice)">
    <path d="M0 61 Q8 56 16 61 T32 61 T48 61 T64 61 T80 61 T96 61 T112 61 T128 61 T144 61" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85" filter="url(#blur)"/>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="12" cy="62" rx="7" ry="1.6"/><ellipse cx="127" cy="62" rx="8" ry="1.6"/>
  </g>
</svg>
