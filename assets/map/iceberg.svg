<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150">
  <!-- «Айсберг вирусного спеца». Одна цельная фигура; граница воды — неровная живая волна -->
  <defs>
    <filter id="brush" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <!-- Вода темнеет с глубиной -->
    <linearGradient id="depth" x1="0" y1="56" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5c96dc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b6cc0" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Силуэт айсберга целиком -->
    <clipPath id="ice">
      <path d="M20 60 L48 22 L62 32 L82 6 L108 40 L120 60 L134 96 L114 136 L56 146 L8 104 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#brush)">
    <g clip-path="url(#ice)">
      <!-- Грани, общие для надводной и подводной части -->
      <rect width="140" height="150" fill="#ffffff"/>
      <path d="M82 6 L108 40 L120 60 L134 96 L114 136 L84 96 L78 30 Z" fill="#cfe2f7"/>
      <path d="M48 22 L62 32 L60 96 L40 80 Z" fill="#e8f2fd"/>
      <path d="M8 104 L30 70 L56 146 Z" fill="#dbeafa"/>
      <path d="M84 96 L114 136 L56 146 Z" fill="#b9d4f2"/>
      <!-- Вода поверх подводной части: верхний край — неровная волна разной высоты -->
      <path d="M-4 64 C6 54 14 58 22 61 C30 64 34 52 46 55 C56 58 58 66 70 62 C80 58 84 50 96 56 C104 60 108 66 118 60 C126 55 132 58 144 62 L144 150 L-4 150 Z" fill="url(#depth)"/>
      <!-- Блики под водой ломают границу -->
      <g stroke="#e6f3ff" stroke-linecap="round" fill="none" opacity="0.6">
        <path d="M26 74 q6 -2 12 0"/><path d="M74 70 q8 -2 16 0"/><path d="M50 88 q5 -2 10 0"/>
        <path d="M96 84 q6 -2 12 0"/><path d="M34 104 q6 -2 12 0"/>
      </g>
    </g>
  </g>

  <!-- Пена по той же волне, мягкая, с разрывами -->
  <g clip-path="url(#ice)">
    <path d="M-4 64 C6 54 14 58 22 61 C30 64 34 52 46 55 C56 58 58 66 70 62 C80 58 84 50 96 56 C104 60 108 66 118 60 C126 55 132 58 144 62" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="26 6 40 8 30 10" opacity="0.9" filter="url(#soft)"/>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="10" cy="62" rx="7" ry="1.8"/><ellipse cx="128" cy="60" rx="8" ry="1.8"/>
  </g>
</svg>
