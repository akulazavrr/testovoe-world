<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Интерьер домика для раздела «Качок Кабачок». Фон, не интерактивный.
       Центр картинки (x 500–1100) виден на любом экране, края — на широких. -->
  <defs>
    <filter id="brush" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <pattern id="wallpaper" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#f8e2c2"/>
      <rect x="0" width="10" height="80" fill="#f2d4ab" opacity="0.7"/>
      <circle cx="45" cy="25" r="4" fill="#ffadad" opacity="0.5"/>
      <circle cx="45" cy="65" r="4" fill="#caffbf" opacity="0.7"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86aee0"/>
      <stop offset="1" stop-color="#d9e8f6"/>
    </linearGradient>
  </defs>

  <g filter="url(#brush)">
    <!-- Стена и пол -->
    <rect width="1600" height="1000" fill="url(#wallpaper)"/>
    <rect y="640" width="1600" height="90" fill="#e7b98b"/>
    <rect y="640" width="1600" height="10" fill="#d9a678"/>
    <rect y="730" width="1600" height="270" fill="#c9935f"/>
    <g stroke="#b07d4c" stroke-width="4" opacity="0.7">
      <path d="M0 790 H1600"/><path d="M0 860 H1600"/><path d="M0 940 H1600"/>
      <path d="M260 730 V790"/><path d="M740 730 V790"/><path d="M1220 730 V790"/>
      <path d="M480 790 V860"/><path d="M1000 790 V860"/><path d="M1460 790 V860"/>
      <path d="M180 860 V940"/><path d="M660 860 V940"/><path d="M1140 860 V940"/>
    </g>

    <!-- Окно с видом на сад -->
    <rect x="160" y="170" width="380" height="330" rx="14" fill="#ffffff"/>
    <rect x="180" y="190" width="340" height="290" rx="6" fill="url(#sky)"/>
    <path d="M180 400 C260 360 340 380 420 360 C470 350 500 360 520 370 L520 480 L180 480 Z" fill="#86c34f"/>
    <path d="M180 440 C280 420 380 440 520 425 L520 480 L180 480 Z" fill="#6fae3f"/>
    <ellipse cx="300" cy="250" rx="46" ry="18" fill="#ffffff" opacity="0.9"/>
    <path d="M350 190 V480 M180 335 H520" stroke="#ffffff" stroke-width="12"/>
    <!-- Шторы -->
    <path d="M140 150 C170 260 150 420 190 540 L120 540 C110 400 120 260 110 150 Z" fill="#ef8d88"/>
    <path d="M560 150 C530 260 550 420 510 540 L580 540 C590 400 580 260 590 150 Z" fill="#ef8d88"/>
    <rect x="100" y="140" width="500" height="16" rx="8" fill="#8a5a3c"/>
    <!-- Подоконник с горшком -->
    <rect x="150" y="500" width="400" height="18" rx="6" fill="#ffffff"/>
    <path d="M410 500 L420 460 L470 460 L480 500 Z" fill="#ef8d88"/>
    <ellipse cx="430" cy="440" rx="22" ry="30" fill="#4f9a3a"/>
    <ellipse cx="462" cy="432" rx="18" ry="34" fill="#6fae3f"/>

    <!-- Картина с кабачком -->
    <rect x="720" y="170" width="200" height="160" rx="8" fill="#8a5a3c"/>
    <rect x="736" y="186" width="168" height="128" rx="4" fill="#fdffb6"/>
    <ellipse cx="820" cy="252" rx="62" ry="22" fill="#4f9a3a" transform="rotate(-15 820 252)"/>
    <path d="M770 262 C800 250 840 246 872 232" stroke="#9ccb45" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="866" cy="234" r="7" fill="#3f7a35"/>

    <!-- Полка справа -->
    <rect x="1120" y="300" width="360" height="18" rx="6" fill="#8a5a3c"/>
    <rect x="1140" y="236" width="44" height="64" rx="8" fill="#a0c4ff"/>
    <rect x="1196" y="250" width="40" height="50" rx="8" fill="#ffd6a5"/>
    <rect x="1246" y="228" width="36" height="72" rx="8" fill="#caffbf"/>
    <path d="M1310 300 L1316 262 L1366 262 L1372 300 Z" fill="#ef8d88"/>
    <path d="M1340 262 C1320 220 1330 190 1344 172 M1340 262 C1360 222 1380 210 1398 200 M1340 262 C1312 240 1298 228 1290 210" stroke="#4f9a3a" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="1400" y="254" width="56" height="46" rx="6" fill="#bdb2ff"/>
    <rect x="1120" y="440" width="360" height="18" rx="6" fill="#8a5a3c"/>
    <rect x="1150" y="372" width="120" height="68" rx="6" fill="#ffadad"/>
    <rect x="1160" y="382" width="100" height="12" rx="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="1330" cy="412" r="28" fill="#ef8d88"/>
    <path d="M1330 386 l6 -8 M1330 386 l-8 -6 M1330 386 l10 0" stroke="#2f6b3a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1400" cy="418" r="22" fill="#fdffb6"/>

    <!-- Стол -->
    <rect x="660" y="560" width="420" height="26" rx="10" fill="#8a5a3c"/>
    <rect x="690" y="586" width="22" height="160" rx="6" fill="#7a4e33"/>
    <rect x="1028" y="586" width="22" height="160" rx="6" fill="#7a4e33"/>
    <!-- На столе: гантель и чек. Сам Качок Кабачок стоит на ковре (отдельная картинка kabachok.png) -->
    <rect x="930" y="538" width="80" height="12" rx="6" fill="#3a3f55"/>
    <rect x="920" y="522" width="18" height="44" rx="6" fill="#3a3f55"/>
    <rect x="1002" y="522" width="18" height="44" rx="6" fill="#3a3f55"/>
    <path d="M1032 560 L1040 500 L1076 504 L1068 562 Z" fill="#ffffff"/>
    <g stroke="#bdb2ff" stroke-width="3"><path d="M1044 514 L1068 517"/><path d="M1042 526 L1066 529"/><path d="M1041 538 L1062 541"/></g>

    <!-- Коврик -->
    <ellipse cx="860" cy="880" rx="420" ry="70" fill="#a0c4ff"/>
    <ellipse cx="860" cy="880" rx="340" ry="52" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.8"/>
    <ellipse cx="860" cy="880" rx="250" ry="36" fill="none" stroke="#bdb2ff" stroke-width="8"/>

    <!-- Кресло слева -->
    <rect x="240" y="640" width="250" height="120" rx="40" fill="#bdb2ff"/>
    <rect x="220" y="580" width="60" height="190" rx="28" fill="#a99df0"/>
    <rect x="450" y="580" width="60" height="190" rx="28" fill="#a99df0"/>
    <rect x="270" y="560" width="190" height="110" rx="30" fill="#c9c0ff"/>
    <rect x="250" y="760" width="16" height="40" rx="6" fill="#7a4e33"/>
    <rect x="464" y="760" width="16" height="40" rx="6" fill="#7a4e33"/>

    <!-- Лампа -->
    <path d="M860 0 V80" stroke="#3a3f55" stroke-width="4"/>
    <path d="M800 120 L820 80 L900 80 L920 120 Z" fill="#ffd6a5"/>
  </g>

  <!-- Тёплый свет лампы -->
  <ellipse cx="860" cy="200" rx="260" ry="160" fill="#fdffb6" opacity="0.35" filter="url(#glow)"/>
</svg>
