<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1000" preserveAspectRatio="none">
  <!-- Айсберг для раздела «Айсберг вирусного проекта». Растягивается на всю высоту сцены.
       Линия воды — на y = 320 (32% высоты), так же, как в css/iceberg.css.
       Вода здесь не рисуется: её граница общая для всей сцены и задаётся в CSS,
       поэтому у айсберга и у моря одна и та же волна без стыков. -->
  <defs>
    <clipPath id="ice">
      <path d="M150 40 L190 0 L222 46 L262 18 L300 92 L330 190 L350 320 L392 430 L398 560 L380 700 L340 820 L280 930 L200 990 L120 950 L60 850 L18 710 L4 560 L14 430 L50 320 L74 210 L110 110 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ice)">
    <rect width="400" height="1000" fill="#ffffff"/>
    <!-- Грани над водой: свет слева -->
    <path d="M262 18 L300 92 L330 190 L350 320 L252 320 L240 120 Z" fill="#cfe2f7"/>
    <path d="M190 0 L222 46 L240 120 L252 320 L172 320 L160 90 Z" fill="#eaf3fd"/>
    <path d="M110 110 L160 90 L172 320 L50 320 L74 210 Z" fill="#f7fbff"/>
    <!-- Грани под водой -->
    <path d="M350 320 L392 430 L398 560 L380 700 L340 820 L280 930 L252 600 L252 320 Z" fill="#b9d4f2"/>
    <path d="M252 320 L252 600 L280 930 L200 990 L150 900 L172 600 L172 320 Z" fill="#d8e8fa"/>
    <path d="M14 430 L4 560 L18 710 L60 850 L120 950 L150 900 L96 640 Z" fill="#cfe2f7"/>
  </g>
</svg>
