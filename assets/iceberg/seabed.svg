<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 170 1600 250" preserveAspectRatio="xMidYMax slice">
  <!-- Морское дно для раздела «Айсберг вирусного проекта»: камни в стиле вырезанной бумаги -->
  <defs>
    <filter id="brush" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="6"/>
    </filter>
  </defs>
  <g filter="url(#brush)">
    <!-- Дальние камни -->
    <path d="M0 300 C120 250 220 280 320 300 C420 240 540 250 640 290 C760 260 880 270 980 300 C1080 250 1200 250 1300 290 C1420 250 1520 270 1600 290 L1600 420 L0 420 Z" fill="#3d3775"/>
    <!-- Ближнее дно -->
    <path d="M0 350 C160 320 300 340 460 350 C620 330 760 320 900 345 C1060 330 1220 320 1380 345 C1480 335 1560 340 1600 345 L1600 420 L0 420 Z" fill="#4c4590"/>
    <!-- Светлые края камней и ближнего дна -->
    <path d="M0 350 C160 320 300 340 460 350 C620 330 760 320 900 345 C1060 330 1220 320 1380 345 C1480 335 1560 340 1600 345" fill="none" stroke="#6f66b8" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M320 300 C420 240 540 250 640 290" fill="none" stroke="#6f66b8" stroke-width="6" stroke-linecap="round"/>
    <path d="M980 300 C1080 250 1200 250 1300 290" fill="none" stroke="#6f66b8" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
